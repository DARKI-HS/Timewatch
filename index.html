<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zeiterfassung</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:30px 16px}main{max-width:430px;margin:auto}h1{text-align:center;font-size:30px;margin:5px 0 18px}.last{background:#1c1c1e;border-radius:20px;padding:18px;text-align:center;margin-bottom:18px}.label{color:#aaa;font-size:14px;margin-bottom:6px}#lastTime{font-size:25px;font-weight:700}#lastDate{color:#aaa;font-size:14px;margin-top:4px}.buttons{display:flex;flex-direction:column;gap:12px}button{display:block;width:100%;height:78px;border:0;border-radius:20px;color:#fff;font-size:21px;font-weight:700;-webkit-appearance:none}.green{background:#30d158}.blue{background:#0a84ff}.orange{background:#ff9f0a}.red{background:#ff453a}button:active{opacity:.7}#status{text-align:center;color:#aaa;font-size:14px;min-height:20px;margin:14px 0}.history{background:#1c1c1e;border-radius:20px;margin-top:8px;overflow:hidden}.history h2{font-size:17px;padding:16px;margin:0}.entry{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid #38383a}.entry small{color:#aaa;text-align:right}.empty{padding:0 16px 16px;color:#aaa}.clear{height:auto;background:none;color:#ff453a;font-size:14px;margin:8px auto 12px}
</style>
</head>
<body>
<main>
<h1>Zeiterfassung</h1>
<div class="last"><div class="label">Letzter Gehen-Zeitpunkt</div><div id="lastTime">Noch nicht erfasst</div><div id="lastDate"></div></div>
<div class="buttons">
<button class="green" onclick="saveEntry('Kommen')">Kommen</button>
<button class="blue" onclick="saveEntry('Dienstfahrt Beginn')">Dienstfahrt Beginn</button>
<button class="orange" onclick="saveEntry('Dienstfahrt Ende')">Dienstfahrt Ende</button>
<button class="red" onclick="saveEntry('Gehen')">Gehen</button>
</div>
<div id="status"></div>
<div class="history"><h2>Letzte Einträge</h2><div id="history"></div><button class="clear" onclick="clearEntries()">Einträge löschen</button></div>
</main>
<script>
const KEY="zeiterfassung_v2";
function get(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function t(d){return d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function d(d){return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})}
function saveEntry(type){const now=new Date(),a=get();a.unshift({type:type,stamp:now.toISOString()});localStorage.setItem(KEY,JSON.stringify(a));render();status(type+" gespeichert: "+d(now)+" "+t(now))}
function status(x){document.getElementById("status").textContent=x;setTimeout(()=>document.getElementById("status").textContent="",3000)}
function render(){const a=get(),last=a.find(x=>x.type==="Gehen");document.getElementById("lastTime").textContent=last?t(new Date(last.stamp)):"Noch nicht erfasst";document.getElementById("lastDate").textContent=last?d(new Date(last.stamp)):"";const h=document.getElementById("history");if(!a.length){h.innerHTML='<div class="empty">Noch keine Einträge vorhanden.</div>';return}h.innerHTML=a.slice(0,20).map(x=>{const z=new Date(x.stamp);return '<div class="entry"><strong>'+x.type+'</strong><small>'+d(z)+'<br>'+t(z)+'</small></div>'}).join("")}
function clearEntries(){if(confirm("Alle Einträge auf diesem Gerät löschen?")){localStorage.removeItem(KEY);render()}}
render();
</script>
</body>
</html>
